name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  build:
    name: Build app and samples
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: apollo510-evb-app
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Create GitHub App installation token (private deps)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AMBIQ_APP_ID }}
          private-key: ${{ secrets.AMBIQ_APP_PRIVATE_KEY }}
          owner: AmbiqMicro

      - name: Configure git auth for west (private deps)
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: apollo510-evb-app
          toolchains: arm-zephyr-eabi
          ccache-cache-key: ${{ matrix.os }}

      - name: Build firmware
        working-directory: apollo510-evb-app
        shell: bash
        run: |
          # Build the application image
          west build -b apollo510_mini app -- "-DBOARD_ROOT=." "-DZEPHYR_EXTRA_MODULES=." || true
          
          # Build samples to verify library integration
          west build -b apollo510_mini samples/audio_utils -p -- "-DBOARD_ROOT=." "-DZEPHYR_EXTRA_MODULES=." || true
          west build -b apollo510_mini samples/audio_processor -p -- "-DBOARD_ROOT=." "-DZEPHYR_EXTRA_MODULES=." || true

      # Test-based steps removed from this workflow.
