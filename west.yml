manifest:
  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyr-ambiq-internal
      url-base: https://github.com/AmbiqMicro/zephyr-ambiq-internal

  projects:
    - name: zephyr
      remote: zephyr-ambiq-internal
      revision: gpu-fix-apollo5
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - cmsis_6    # required by the ARM port for Cortex-M
          - hal_ambiq # required by the custom_plank board (Ambiq based)
