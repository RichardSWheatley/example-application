description: |
  Ambiq Apollo510 FreeRTOS-style MSPI controller.

  This node instantiates the out-of-tree `mspi_freertos` driver class for the
  Ambiq Apollo510 family. The driver serializes every transfer with a mutex
  and waits on a binary semaphore released from the controller's IRQ handler,
  mirroring the synchronization pattern used by native FreeRTOS MSPI drivers.

  Example:

    mspi_freertos0: mspi-freertos@40014000 {
        compatible = "ambiq,apollo510-mspi-freertos";
        reg = <0x40014000 0x400>;
        interrupts = <20 0>;
        clock-frequency = <48000000>;
        ambiq,channel = <0>;
        ambiq,io-mode = <0>;
        pinctrl-0 = <&mspi0_default>;
        pinctrl-names = "default";
        status = "okay";
    };

compatible: "ambiq,apollo510-mspi-freertos"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clock-frequency:
    type: int
    required: true
    description: Default MSPI SCLK frequency in Hz.

  ambiq,channel:
    type: int
    default: 0
    description: |
      Apollo510 MSPI hardware channel index (0..3). Selects which physical
      MSPI controller this node binds to.

  ambiq,io-mode:
    type: int
    default: 0
    description: |
      MSPI line-width selector used by the low-level HAL shim. The value is
      passed through to the vendor HAL and is not interpreted by the driver
      itself; 0 selects the HAL default (single line / legacy SPI).

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
