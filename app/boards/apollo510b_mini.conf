# SPDX-License-Identifier: Apache-2.0
# apollo510b_mini: no display/touch; match EVB-class bring-up.

CONFIG_DISPLAY=n
CONFIG_MIPI_DSI=n
CONFIG_LVGL=n
CONFIG_INPUT_CHSC5X=n
CONFIG_LV_Z_POINTER_INPUT=n

CONFIG_AUDIO=n
CONFIG_AUDIO_DMIC=n

# Silence unused LVGL options from prj.conf when LVGL is off.
CONFIG_WARN_EXPERIMENTAL=n

# BLE HR peripheral thread (from samples/bluetooth/peripheral_hr)
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_BAS=y
CONFIG_BT_HRS=y
CONFIG_BT_DEVICE_NAME="Zephyr Heartrate Sensor"
CONFIG_BT_DEVICE_APPEARANCE=833

# MSPI Whoop-style stress thread (aps51216ba on mspi0)
CONFIG_MSPI=y
CONFIG_MSPI_DMA=y
CONFIG_MSPI_TIMING=y
CONFIG_MSPI_AMBIQ_TIMING_SCAN=y
CONFIG_MSPI_COMPLETION_TIMEOUT_TOLERANCE=100
