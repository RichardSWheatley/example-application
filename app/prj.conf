# This file contains selected Kconfig options for the application.

CONFIG_PRINTK=y

# Keep UART output single-source through printk queue thread
CONFIG_LOG=y
CONFIG_TRACING=n

CONFIG_LV_USE_DRAW_AMBIQ=y
CONFIG_LV_USE_AMBIQ_VG=y
CONFIG_LV_DRAW_BUF_ALIGN=8
CONFIG_LV_ATTRIBUTE_MEM_ALIGN_SIZE=8
CONFIG_LV_DRAW_LAYER_SIMPLE_BUF_SIZE=262144
CONFIG_LV_BIN_DECODER_RAM_LOAD=y
CONFIG_LV_USE_SYSMON=y
CONFIG_LV_USE_PERF_MONITOR=y
CONFIG_LV_USE_MEM_MONITOR=y
CONFIG_LV_PERF_MONITOR_ALIGN_BOTTOM_MID=y
CONFIG_LV_MEM_MONITOR_ALIGN_TOP_MID=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_DEF_REFR_PERIOD=16

CONFIG_LV_Z_LARGE_CONST_SECTION=".gfx.assets"
CONFIG_LV_Z_COLOR_24_BGR_TO_RGB=n
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_AUTO_INIT=y
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=n
CONFIG_LV_Z_USE_OSAL=y
CONFIG_LV_Z_MEM_POOL_SYS_HEAP=y
CONFIG_LV_Z_MEM_POOL_SIZE=262144
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_MONOCHROME_CONVERSION_BUFFER=n
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y
CONFIG_LV_Z_REFRESH_AREA_WIDTH=392
CONFIG_LV_Z_REFRESH_AREA_HEIGHT=392
CONFIG_LV_Z_POINTER_INPUT=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_CPU_LOAD=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Dynamic thread support
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y

CONFIG_HEAP_MEM_POOL_SIZE=20480
CONFIG_LV_Z_FLUSH_THREAD_STACK_SIZE=4096

# Runtime stack diagnostics
CONFIG_THREAD_STACK_INFO=y

CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_INPUT_CHSC5X=y

# PSRAM
CONFIG_MEMC=y
CONFIG_MEMC_MSPI_APS_Z8=y
CONFIG_MEMC_MSPI_APS51216BA=y
CONFIG_WATCHDOG=y
CONFIG_SHELL=n

CONFIG_LVGL=y
CONFIG_LV_Z_SHELL=n
CONFIG_LV_USE_MONKEY=y

# Reset/fatal diagnostics during freeze investigation
CONFIG_HWINFO=y

CONFIG_DISPLAY=y

# Audio DMIC (PDM)
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# RTC with alarm support
CONFIG_RTC=y
CONFIG_RTC_ALARM=y

CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_24=y

# Benchmark Demo
CONFIG_LV_USE_FONT_COMPRESSED=y

# MCUboot support
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_REBOOT=y
