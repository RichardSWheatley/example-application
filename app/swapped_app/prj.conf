# SPDX-License-Identifier: Apache-2.0

# LMA adjustment moves image to secondary slot — hex output ensures
# debuggers flash the binary to the correct location.
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BOOTLOADER_MCUBOOT=y

# MCUboot image management — needed for boot_write_img_confirmed()
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

# LED and button threads
CONFIG_GPIO=y
CONFIG_REBOOT=y
CONFIG_PRINTK=y
CONFIG_LOG=y
